# Whole stack: `make up` (or `docker compose up --build -d`)
#   web http://localhost:3000   api http://localhost:8000   MySQL localhost:3308
# Change host ports with WEB_PORT / API_PORT, e.g. `WEB_PORT=3010 API_PORT=8010 make up`.
# Secrets (JWT_KEY, Google keys, SMTP...) come from backend/.env.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_shortener
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/url_shortener
      FRONTEND_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # baked into the JS at build time; the browser calls the API directly
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  db_data:
