# Whole stack on your machine: `make up`. Ports and settings come from .env.
#   web http://localhost:3100   api http://localhost:8100   MySQL :3308
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_shortener
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file: .env
    environment:
      # inside the stack, services reach each other by name
      DATABASE_URL: mysql+pymysql://root:root@db:3306/url_shortener
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # baked into the JS at build time; the browser calls the API directly
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api

volumes:
  db_data:
