# Production stack for one server: `make prod`.
# Reads .env, then .env.production (server only, never committed) which overrides it:
#   DOMAIN, JWT_KEY, DB_PASSWORD, DB_ROOT_PASSWORD, SMTP_*, GOOGLE_* ...
# https://DOMAIN serves the API and the short links, https://app.DOMAIN the web app.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: url_shortener
      MYSQL_USER: shortener
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.production}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    # no "ports:" on purpose: only the other containers can reach the database

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./backend
    restart: unless-stopped
    env_file: [.env, .env.production]
    environment:
      DATABASE_URL: mysql+pymysql://shortener:${DB_PASSWORD}@db:3306/url_shortener
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: https://app.${DOMAIN:?set DOMAIN in .env.production}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/auth/google/callback
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://${DOMAIN}
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # the HTTPS certificates: keep this volume
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  db_data:
  caddy_data:
  caddy_config:
